# Deploy ke Cloudflare HANYA lewat workflow ini, supaya situs yang berjalan selalu
# bisa dicocokkan dengan commit di repo (commit tampil di footer situs).
#
# - Production: push tag `v*` (mis. `git tag v1.0.0 && git push origin v1.0.0`).
# - Staging: jalankan manual dari tab Actions (workflow_dispatch).
#
# Butuh secret CLOUDFLARE_API_TOKEN (izin: Cloudflare Pages Edit + D1 Edit) dan
# CLOUDFLARE_ACCOUNT_ID, sebaiknya sebagai secret environment `production`/`staging`, bukan secret
# repo. Token hanya dipasang di langkah wrangler, supaya `pnpm install`, tes, dan build tidak bisa
# membacanya.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Lingkungan tujuan
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'production' }}
    env:
      TARGET: ${{ github.event.inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Migrasi database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm wrangler d1 migrations apply pemira-db --remote
          else
            pnpm wrangler d1 migrations apply pemira-db-staging --env preview --remote
          fi

      # Cloudflare Pages: branch `main` = production, branch lain = preview (staging).
      - name: Deploy ke Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA"
          else
            pnpm wrangler pages deploy --branch staging --commit-hash "$GITHUB_SHA"
          fi
