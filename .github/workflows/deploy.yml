# Deploy ke Cloudflare HANYA lewat workflow ini, supaya situs yang berjalan selalu
# bisa dicocokkan dengan commit di repo (commit tampil di footer situs).
#
# - Production: push tag `v*` (mis. `git tag v1.0.0 && git push origin v1.0.0`).
# - Staging: jalankan manual dari tab Actions (workflow_dispatch).
#
# Butuh secret repo: CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Lingkungan tujuan
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'production' }}
    env:
      TARGET: ${{ github.event.inputs.target || 'production' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Migrasi database
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm wrangler d1 migrations apply pemira-db --remote
          else
            pnpm wrangler d1 migrations apply pemira-db-staging --env staging --remote
          fi

      - name: Deploy Worker
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm wrangler deploy
          else
            pnpm wrangler deploy --env staging
          fi
